name: CI

# The proving gate: everything that can be checked without AWS. Runs on every
# pull request, and make it a required check before anything reaches the deploy
# branch.
#
# Three suites, cheapest first, so a typo in the client fails in seconds rather
# than after a browser has booted:
#
#   tsc --noEmit   the generated SDK and the app agree
#   vitest         pure client logic (see web/src/components/Avatar.test.ts)
#   cucumber       the app itself, including one real-browser upload scenario
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Pinned here rather than by .ruby-version, which this repo does not
          # carry. Keep in step with the version the Lambdas are built for.
          ruby-version: '4.0.5'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the client's dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Install Chrome
        # features/support/env.rb looks for it under web/chrome, the same place
        # the local setup puts it, so the driver config needs no CI special case.
        run: npx @puppeteer/browsers install chrome@stable --path "$PWD/web/chrome"

      - name: Cucumber
        # Brings up DynamoDB Local, creates the tables, starts the Rack API and
        # the Vite dev server, waits for both, then runs the suite.
        run: script/cucumber.sh
