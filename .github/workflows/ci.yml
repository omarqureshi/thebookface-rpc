name: CI

# Runs on pull requests AND on pushes to the deployable branches. The push
# trigger matters here: work lands on main directly rather than always through a
# pull request, and a PR-only gate meant the suite had never run at all.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/_test.yml
